<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PK TRADER REAL PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title {
            color: #00f2ff;
            font-size: 18px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .owner-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #ffcc00;
            font-weight: 600;
            margin-top: 4px;
        }

        .owner-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
        }

        .logo-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #00f2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
        }

        .controls {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        select {
            flex: 1;
            background: #151a23;
            color: #00f2ff;
            border: 1px solid #2a3241;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: #151a23;
            color: #ffffff;
        }

        .chart-container {
            width: 100%;
            max-width: 480px;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2a3241;
            margin-bottom: 12px;
        }

        .indicators {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .ind-box {
            background: #151a23;
            border: 1px solid #2a3241;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .ind-title {
            font-size: 10px;
            color: #848e9c;
            margin-bottom: 4px;
        }

        .ind-value {
            font-size: 12px;
            font-weight: bold;
        }

        .signal-card {
            width: 100%;
            max-width: 480px;
            background: #151a23;
            border: 1px solid #2a3241;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .signal-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .signal-type {
            font-weight: bold;
            color: #ff3b30;
        }

        .btn-signal {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
            margin-bottom: 12px;
        }

        .footer {
            font-size: 11px;
            color: #5e6673;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title-container">
                <span style="color:#ffcc00;">⚡</span>
                <span class="title">PK TRADER REAL PRO</span>
            </div>
            <div class="owner-badge">
                Owner : NomaN
                <img class="owner-avatar" src="https://i.ibb.co/L5392P7/anime-boy.jpg" alt="Owner">
            </div>
        </div>
        <div class="logo-circle">PK</div>
    </div>

    <div class="controls">
        <select id="pair-select" onchange="updateChart()">
            <!-- Forex Market Pairs -->
            <optgroup label="Forex Pairs">
                <option value="FX:EURUSD" selected>EUR/USD</option>
                <option value="FX:GBPUSD">GBP/USD</option>
                <option value="FX:USDJPY">USD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option>
                <option value="FX:USDCAD">USD/CAD</option>
                <option value="FX:USDCHF">USD/CHF</option>
                <option value="FX:EURGBP">EUR/GBP</option>
                <option value="FX:EURJPY">EUR/JPY</option>

            <!-- Crypto Market Pairs -->
            <optgroup label="Crypto Pairs">
                <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                <option value="BINANCE:ETHUSDT">ETH/USDT</option>
                <option value="BINANCE:BNBUSDT">BNB/USDT</option>
                <option value="BINANCE:SOLUSDT">SOL/USDT</option>
                <option value="BINANCE:XRPUSDT">XRP/USDT</option>
                <option value="BINANCE:DOGEUSDT">DOGE/USDT</option>
                <option value="BINANCE:ADAUSDT">ADA/USDT</option>
                <option value="BINANCE:AVAXUSDT">AVAX/USDT</option>
                <option value="BINANCE:MATICUSDT">MATIC/USDT</option>
                <option value="BINANCE:DOTUSDT">DOT/USDT</option>
                <option value="BINANCE:LTCUSDT">LTC/USDT</option>
            </optgroup>
        </select>

        <select id="time-select" onchange="updateChart()">
            <option value="1">1 Min (1m)</option>
            <option value="5">5 Min (5m)</option>
            <option value="15">15 Min (15m)</option>
        </select>
    </div>

    <div class="chart-container" id="tv_chart"></div>

    <div class="indicators">
        <div class="ind-box">
            <div class="ind-title">RSI (14)</div>
            <div class="ind-value" id="ind-rsi" style="color:#ff3b30;">64.0 🔴</div>
        </div>
        <div class="ind-box">
            <div class="ind-title">EMA (9/21)</div>
            <div class="ind-value" id="ind-ema" style="color:#ff3b30;">BEARISH 🔴</div>
        </div>
        <div class="ind-box">
            <div class="ind-title">SUMMARY</div>
            <div class="ind-value" id="ind-sum" style="color:#ff3b30;">STRONG SELL 🔴</div>
        </div>
    </div>

    <div class="signal-card">
        <div class="signal-row">
            <span>Signal Type:</span>
            <span class="signal-type" id="signal-type">PUT (SELL) 🔴</span>
        </div>
        <div class="signal-row">
            <span>Entry Time:</span>
            <span style="color:#ffcc00; font-weight:bold;" id="entry-time">15:35:00</span>
        </div>
        <div class="signal-row">
            <span>Signal Confidence:</span>
            <span style="color:#00f2ff; font-weight:bold;" id="signal-confidence">95%</span>
        </div>
    </div>

    <button class="btn-signal" onclick="fetchNewSignal()">GET FUTURE SIGNAL</button>

    <div class="footer">@pk_trading_analysis_bot</div>

    <script type="text/javascript">
        let widget;

        function loadChart(symbol, interval) {
            document.getElementById('tv_chart').innerHTML = '';
            widget = new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": symbol,
                "interval": interval,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_legend": true,
                "save_image": false,
                "container_id": "tv_chart"
            });
        }

        function updateChart() {
            const pair = document.getElementById('pair-select').value;
            const time = document.getElementById('time-select').value;
            loadChart(pair, time);
        }

        function fetchNewSignal() {
            const types = ["CALL (BUY) 🟢", "PUT (SELL) 🔴"];
            const confs = ["90%", "92%", "95%", "98%"];
            
            const isBuy = Math.random() > 0.5;
            const chosenType = isBuy ? "CALL (BUY) 🟢" : "PUT (SELL) 🔴";
            const color = isBuy ? "#34c759" : "#ff3b30";

            document.getElementById('signal-type').innerText = chosenType;
            document.getElementById('signal-type').style.color = color;
            document.getElementById('ind-rsi').style.color = color;
            document.getElementById('ind-ema').style.color = color;
            document.getElementById('ind-sum').style.color = color;

            document.getElementById('ind-rsi').innerText = isBuy ? "36.0 🟢" : "64.0 🔴";
            document.getElementById('ind-ema').innerText = isBuy ? "BULLISH 🟢" : "BEARISH 🔴";
            document.getElementById('ind-sum').innerText = isBuy ? "STRONG BUY 🟢" : "STRONG SELL 🔴";

            document.getElementById('signal-confidence').innerText = confs[Math.floor(Math.random() * confs.length)];
            
            const now = new Date();
            now.setMinutes(now.getMinutes() + 1);
            document.getElementById('entry-time').innerText = now.toTimeString().split(' ')[0];
        }

        // Initial Chart Load
        loadChart('FX:EURUSD', '1');
    </script>
</body>
</html>
