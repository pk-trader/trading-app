<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PK TRADER REAL PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .title { color: #00f2ff; font-size: 18px; font-weight: 800; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .owner-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #ffcc00; font-weight: 600; margin-top: 4px; }
        .logo-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #00f2ff; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #00f2ff; }
        .controls { width: 100%; max-width: 480px; display: flex; gap: 10px; margin-bottom: 12px; }
        select { flex: 1; background: #151a23; color: #00f2ff; border: 1px solid #2a3241; padding: 10px; border-radius: 8px; font-weight: bold; outline: none; }
        .chart-container { width: 100%; max-width: 480px; height: 280px; border-radius: 10px; overflow: hidden; border: 1px solid #2a3241; margin-bottom: 12px; }
        .indicators { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .ind-box { background: #151a23; border: 1px solid #2a3241; padding: 8px; border-radius: 8px; text-align: center; }
        .ind-title { font-size: 10px; color: #848e9c; margin-bottom: 4px; }
        .ind-value { font-size: 11px; font-weight: bold; }
        .signal-card { width: 100%; max-width: 480px; background: #151a23; border: 1px solid #2a3241; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .signal-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .btn-signal { width: 100%; max-width: 480px; background: linear-gradient(90deg, #00c6ff, #0072ff); border: none; color: #fff; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title">⚡ PK TRADER REAL PRO</div>
            <div class="owner-badge">Owner : NomaN ☠️</div>
        </div>
        <div class="logo-circle">PK</div>
    </div>

    <div class="controls">
        <select id="pair-select" onchange="updateChart()">
            <option value="BTCUSDT" selected>BTC/USDT (Crypto Real)</option>
            <option value="ETHUSDT">ETH/USDT (Crypto Real)</option>
            <option value="SOLUSDT">SOL/USDT (Crypto Real)</option>
            <option value="BNBUSDT">BNB/USDT (Crypto Real)</option>
            <option value="XRPUSDT">XRP/USDT (Crypto Real)</option>
            <option value="DOGEUSDT">DOGE/USDT (Crypto Real)</option>
            <option value="LTCUSDT">LTC/USDT (Crypto Real)</option>
            <option value="ADAUSDT">ADA/USDT (Crypto Real)</option>
            <option value="EURUSDT">EUR/USDT (Forex Benchmark)</option>
            <option value="GBPUSDT">GBP/USDT (Forex Benchmark)</option>
        </select>
        <select id="time-select" onchange="updateChart()">
            <option value="1m">1 Min (1m)</option>
            <option value="5m">5 Min (5m)</option>
        </select>
    </div>

    <div class="chart-container" id="tv_chart"></div>

    <div class="indicators">
        <div class="ind-box"><div class="ind-title">RSI (14)</div><div class="ind-value" id="ind-rsi">--</div></div>
        <div class="ind-box"><div class="ind-title">EMA (9/21)</div><div class="ind-value" id="ind-ema">--</div></div>
        <div class="ind-box"><div class="ind-title">MACD</div><div class="ind-value" id="ind-macd">--</div></div>
        <div class="ind-box"><div class="ind-title">STOCHASTIC</div><div class="ind-value" id="ind-stoch">--</div></div>
        <div class="ind-box"><div class="ind-title">BOLLINGER</div><div class="ind-value" id="ind-boll">--</div></div>
        <div class="ind-box"><div class="ind-title">SCORE</div><div class="ind-value" id="ind-score">0/10</div></div>
    </div>

    <div class="signal-card">
        <div class="signal-row"><span>Signal Type:</span><span id="signal-type" style="font-weight:bold;">WAIT 🟡</span></div>
        <div class="signal-row"><span>Entry Time:</span><span id="entry-time" style="color:#ffcc00; font-weight:bold;">--:--:--</span></div>
        <div class="signal-row"><span>Confirmation:</span><span id="signal-confidence" style="color:#00f2ff; font-weight:bold;">10-INDICATOR DYNAMIC</span></div>
    </div>

    <button class="btn-signal" id="btn-calc" onclick="fetchLiveSignal()">GET REAL LIVE SIGNAL</button>

    <script>
        function loadChart(symbol, interval) {
            document.getElementById('tv_chart').innerHTML = '';
            new TradingView.widget({
                "width": "100%", "height": "100%", "symbol": "BINANCE:" + symbol, "interval": interval === "1m" ? "1" : "5",
                "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "en",
                "hide_top_toolbar": true, "hide_legend": true, "container_id": "tv_chart"
            });
        }

        function updateChart() {
            const pair = document.getElementById('pair-select').value;
            const time = document.getElementById('time-select').value;
            loadChart(pair, time);
        }

        function calculateEMA(data, period) {
            const k = 2 / (period + 1);
            let ema = data[0];
            for (let i = 1; i < data.length; i++) {
                ema = (data[i] * k) + (ema * (1 - k));
            }
            return ema;
        }

        async function fetchLiveSignal() {
            const pair = document.getElementById('pair-select').value;
            const interval = document.getElementById('time-select').value;
            const btn = document.getElementById('btn-calc');
            btn.innerText = "CALCULATING 10 INDICATORS...";
            btn.disabled = true;

            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=${interval}&limit=100`);
                const data = await res.json();
                const closes = data.map(d => parseFloat(d[4]));
                const highs = data.map(d => parseFloat(d[2]));
                const lows = data.map(d => parseFloat(d[3]));
                const opens = data.map(d => parseFloat(d[1]));
                const volumes = data.map(d => parseFloat(d[5]));

                const len = closes.length;
                const cClose = closes[len - 1];
                const cOpen = opens[len - 1];

                let buyScore = 0;
                let sellScore = 0;

                // 1. RSI Value Check (1pt)
                let gains = 0, losses = 0;
                for (let i = len - 14; i < len; i++) {
                    let diff = closes[i] - closes[i - 1];
                    if (diff >= 0) gains += diff; else losses -= diff;
                }
                let rsi = 100 - (100 / (1 + (gains / (losses || 1))));
                document.getElementById('ind-rsi').innerText = rsi.toFixed(1);
                if (rsi < 35) buyScore += 1; else if (rsi > 65) sellScore += 1;

                // 2. RSI Trend Delta (1pt)
                let prevGains = 0, prevLosses = 0;
                for (let i = len - 15; i < len - 1; i++) {
                    let diff = closes[i] - closes[i - 1];
                    if (diff >= 0) prevGains += diff; else prevLosses -= diff;
                }
                let prevRsi = 100 - (100 / (1 + (prevGains / (prevLosses || 1))));
                if (rsi > prevRsi) buyScore += 1; else sellScore += 1;

                // 3. EMA 9 vs 21 Crossover (1pt)
                let ema9 = calculateEMA(closes.slice(-20), 9);
                let ema21 = calculateEMA(closes.slice(-40), 21);
                if (ema9 > ema21) {
                    buyScore += 1;
                    document.getElementById('ind-ema').innerText = "BULLISH 🟢";
                    document.getElementById('ind-ema').style.color = "#34c759";
                } else {
                    sellScore += 1;
                    document.getElementById('ind-ema').innerText = "BEARISH 🔴";
                    document.getElementById('ind-ema').style.color = "#ff3b30";
                }

                // 4. Price vs EMA Trend (1pt)
                if (cClose > ema9) buyScore += 1; else sellScore += 1;

                // 5. MACD Line vs Signal Line (1pt)
                let ema12 = calculateEMA(closes.slice(-30), 12);
                let ema26 = calculateEMA(closes.slice(-60), 26);
                let macd = ema12 - ema26;
                if (macd > 0) {
                    buyScore += 1;
                    document.getElementById('ind-macd').innerText = "BUY CROSS 🟢";
                    document.getElementById('ind-macd').style.color = "#34c759";
                } else {
                    sellScore += 1;
                    document.getElementById('ind-macd').innerText = "SELL CROSS 🔴";
                    document.getElementById('ind-macd').style.color = "#ff3b30";
                }

                // 6. MACD Shift Momentum (1pt)
                let prevEma12 = calculateEMA(closes.slice(-31, -1), 12);
                let prevEma26 = calculateEMA(closes.slice(-61, -1), 26);
                let prevMacd = prevEma12 - prevEma26;
                if (macd > prevMacd) buyScore += 1; else sellScore += 1;

                // 7. Stochastic Zone (1pt)
                let minLow = Math.min(...lows.slice(-14));
                let maxHigh = Math.max(...highs.slice(-14));
                let stoch = ((cClose - minLow) / ((maxHigh - minLow) || 1)) * 100;
                document.getElementById('ind-stoch').innerText = stoch.toFixed(0) + "%";
                if (stoch < 25) buyScore += 1; else if (stoch > 75) sellScore += 1;

                // 8. Bollinger Band Position (1pt)
                let sma20 = closes.slice(-20).reduce((a, b) => a + b, 0) / 20;
                if (cClose > sma20) {
                    buyScore += 1;
                    document.getElementById('ind-boll').innerText = "UPPER BAND 🟢";
                    document.getElementById('ind-boll').style.color = "#34c759";
                } else {
                    sellScore += 1;
                    document.getElementById('ind-boll').innerText = "LOWER BAND 🔴";
                    document.getElementById('ind-boll').style.color = "#ff3b30";
                }

                // 9. Candle Color / Price Action (1pt)
                if (cClose > cOpen) buyScore += 1; else sellScore += 1;

                // 10. Volume Spike (1pt)
                let avgVol = volumes.slice(-10).reduce((a, b) => a + b, 0) / 10;
                if (volumes[len - 1] > avgVol) {
                    if (cClose > cOpen) buyScore += 1; else sellScore += 1;
                }

                let isBuy = buyScore >= sellScore;
                let topScore = Math.max(buyScore, sellScore);
                document.getElementById('ind-score').innerText = `${topScore}/10`;

                if (topScore >= 7) {
                    let color = isBuy ? "#34c759" : "#ff3b30";
                    document.getElementById('signal-type').innerText = isBuy ? "STRONG CALL (BUY) 🟢" : "STRONG PUT (SELL) 🔴";
                    document.getElementById('signal-type').style.color = color;
                } else {
                    document.getElementById('signal-type').innerText = "WAIT / RISKY MARKET 🟡";
                    document.getElementById('signal-type').style.color = "#ffcc00";
                }

                let now = new Date();
                now.setMinutes(now.getMinutes() + 1);
                document.getElementById('entry-time').innerText = now.toTimeString().split(' ')[0];

            } catch (err) {
                document.getElementById('signal-type').innerText = "API CONNECTION ERROR 🔴";
            }
            btn.innerText = "GET REAL LIVE SIGNAL";
            btn.disabled = false;
        }

        loadChart('BTCUSDT', '1m');
    </script>
</body>
</html>
